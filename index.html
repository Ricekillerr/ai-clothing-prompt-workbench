<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Atelier · AI服装提示词资产工作台</title>
<style>
:root{--bg:#11141a;--panel:#1b2029;--panel2:#222a36;--line:#ffffff12;--text:#edf0f5;--muted:#929baa;--blue:#91aaff;--green:#7bc5a2;--amber:#d9ae78}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 72% -20%,#34405666,transparent 40%),linear-gradient(135deg,#11141a,#171c25 58%,#11141a);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:23px 14px;background:#11151dcc;border-right:1px solid var(--line);backdrop-filter:blur(24px);display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 28px}.logo{width:35px;height:35px;border-radius:12px;background:linear-gradient(145deg,#dce5ff,#718bd0);display:grid;place-items:center;color:#1b2740;font-size:19px}.brand b{font-size:13px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px}.navhead{font-size:9px;color:#697384;letter-spacing:1.5px;padding:13px 12px 7px}.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:2px 0;border-radius:10px;color:#aeb7c5;cursor:pointer}.nav:hover{background:#ffffff0b;color:white}.nav.active{background:#8ca8ff20;color:#e3eaff;box-shadow:inset 2px 0 #9db4ff}.ico{width:17px;text-align:center;color:#b9c7e4}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:15px 9px 0;color:#788293;font-size:9px}
.main{padding:24px 28px 40px;max-width:1700px;width:100%;margin:auto;min-width:0}.top{display:flex;align-items:center;gap:15px;margin-bottom:23px}.heading{min-width:210px}.heading h1{font-size:20px;margin:0;font-weight:650}.heading p{font-size:10px;color:var(--muted);margin:4px 0 0}.search{height:41px;max-width:470px;flex:1;display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:#ffffff09;backdrop-filter:blur(16px)}.search input{border:0;outline:0;background:none;color:white;width:100%}.search input::placeholder{color:#7d8796}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:#ffffff09;color:#dce2ec}.btn:hover{background:#ffffff16}.btn.primary{background:#dce5ff;color:#1b263c;border-color:#dce5ff;font-weight:650}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(145deg,#ffffff0b,#ffffff04);backdrop-filter:blur(18px)}.stat label{color:var(--muted);font-size:10px}.stat strong{display:block;font-size:24px;margin-top:4px}.stat small{font-size:9px;color:#7f8998}
.section{display:flex;justify-content:space-between;align-items:end;margin:3px 0 14px}.section h2{font-size:16px;margin:0}.section p{font-size:10px;color:var(--muted);margin:4px 0 0}.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.chip,.filter{border:1px solid var(--line);border-radius:99px;background:#ffffff08;color:#aeb7c6;padding:7px 11px;font-size:10px}.chip.active{background:#dce5ff;color:#1b263c;border-color:#dce5ff}.filter{border-radius:8px}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#222a35,#191f28);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#a7baff77;box-shadow:0 15px 30px #0004}.photo{height:190px;background:linear-gradient(145deg,#394352,#202732);position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.placeholder{height:100%;display:grid;place-items:center;color:#8290a5;font-size:38px;background:radial-gradient(ellipse,#465263,#202732 75%)}.state{position:absolute;top:9px;left:9px;padding:4px 8px;border-radius:99px;background:#17251fdd;color:#a5dfbd;font-size:9px;backdrop-filter:blur(12px)}.state.pending{background:#382c1ddd;color:#efc58d}.state.failed{background:#3b2323dd;color:#e7a2a2}.cardbody{padding:11px 12px}.cardtitle{font-weight:650;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{font-size:9px;padding:3px 6px;border:1px solid #ffffff0b;background:#ffffff0b;border-radius:5px;color:#b4bdca}.cardfoot{display:flex;justify-content:space-between;color:#8792a2;font-size:9px;margin-top:10px}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed #ffffff25;border-radius:14px;color:var(--muted)}.empty b{display:block;color:#e6eaf1;font-size:14px;margin-bottom:5px}
.modulegrid,.vaultgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.module,.vault{border:1px solid var(--line);border-radius:13px;padding:16px;background:#ffffff08;cursor:pointer}.module:hover,.vault:hover{border-color:#9bb2ff77;background:#ffffff0d}.kind{color:#a9bdf0;font-size:10px;margin-bottom:8px}.module h3,.vault h3{font-size:13px;margin:0 0 7px}.module p,.vault p{font-size:10px;color:#aab4c3;line-height:1.7;max-height:65px;overflow:hidden;white-space:pre-wrap}.modulefoot{font-size:9px;color:#7f8998;display:flex;justify-content:space-between;margin-top:10px}
.compose{display:grid;grid-template-columns:280px 1fr;gap:14px}.pane{border:1px solid var(--line);border-radius:13px;background:#ffffff08;padding:15px}.pane h3{font-size:12px;margin:0 0 12px}.pane select,.pane textarea,.field input,.field select,.field textarea{width:100%;background:#111720;border:1px solid var(--line);border-radius:8px;padding:9px;color:#edf0f5}.pane textarea{height:380px;line-height:1.7}.check{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff0b;color:#c2cad6;font-size:10px}
.overlay{position:fixed;inset:0;display:none;justify-content:flex-end;background:#070a10a8;backdrop-filter:blur(8px);z-index:10}.overlay.open{display:flex}.detail{width:min(470px,94vw);height:100%;overflow:auto;padding:23px;background:#1d232eeb;backdrop-filter:blur(28px);border-left:1px solid #ffffff20;box-shadow:-25px 0 80px #0008}.dhead{display:flex;justify-content:space-between;align-items:center}.dhead h2{font-size:16px;margin:0}.close{width:31px;height:31px;border:0;border-radius:8px;background:#ffffff12;color:white;font-size:18px}.hero{height:260px;border-radius:12px;overflow:hidden;background:#333d4b;margin:17px 0 13px}.hero img{width:100%;height:100%;object-fit:contain;background:#252c37}.hero .placeholder{font-size:48px}.dtitle{font-size:16px;font-weight:650}.dinfo{display:grid;grid-template-columns:82px 1fr;gap:9px;border-top:1px solid var(--line);padding:14px 0;margin-top:14px;font-size:10px}.dinfo .k{color:#8994a4}.dinfo .v{color:#dce2eb}.tabs{display:flex;gap:17px;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;padding:10px 0;color:#929dac;font-size:10px;border-bottom:2px solid transparent}.tabs button.active{color:#e2eaff;border-color:#a5baff}.prompt{white-space:pre-wrap;line-height:1.8;font-size:10px;color:#cbd3df;background:#111720bb;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px;max-height:260px;overflow:auto}.dactions{display:flex;gap:8px;margin-top:12px}.dactions .btn{flex:1}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#070a10bb;backdrop-filter:blur(8px);z-index:20}.modal.open{display:flex}.modalbox{width:min(740px,96vw);max-height:92vh;overflow:auto;padding:21px;background:#1d232e;border:1px solid #ffffff20;border-radius:16px;box-shadow:0 25px 90px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{font-size:16px;margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#9ca7b7}.field textarea{min-height:115px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;z-index:40;background:#e3eaff;color:#1a263d;border-radius:9px;padding:9px 15px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1150px){.gallery{grid-template-columns:repeat(3,1fr)}.main{padding:20px}.app{grid-template-columns:185px 1fr}.side{padding:20px 10px}}@media(max-width:850px){.app{grid-template-columns:62px 1fr}.side{width:62px;padding:18px 7px}.brand b,.brand small,.navhead,.nav span:not(.ico),.sidefoot{display:none}.brand{padding:0 5px 25px}.nav{justify-content:center;padding:12px 4px}.stats{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:repeat(2,1fr)}.top{flex-wrap:wrap}.heading{width:100%}.modulegrid,.vaultgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:570px){.main{padding:14px 10px}.gallery{gap:8px}.photo{height:135px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}.actions .btn{padding:7px}.modulegrid,.vaultgrid,.compose{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">⌂</div><div><b>Prompt Atelier</b><small>AI CLOTHING WORKSPACE</small></div></div><div class="navhead">WORKSPACE</div><div class="nav active" data-page="gallery"><span class="ico">▦</span><span>视觉资产库</span></div><div class="nav" data-page="modules"><span class="ico">◇</span><span>提示词模块</span></div><div class="nav" data-page="vault"><span class="ico">▤</span><span>Prompt Vault</span></div><div class="nav" data-page="smartsearch"><span class="ico">⌕</span><span>智能案例检索</span></div><div class="nav" data-page="compose"><span class="ico">✣</span><span>智能组合器</span></div><div class="navhead">CATEGORIES</div><div class="nav" data-cat="上装"><span class="ico">♧</span><span>上装</span></div><div class="nav" data-cat="下装"><span class="ico">⌑</span><span>下装</span></div><div class="nav" data-cat="鞋履"><span class="ico">◈</span><span>鞋履</span></div><div class="nav" data-cat="配饰"><span class="ico">◇</span><span>配饰</span></div><div class="navhead">LIBRARY</div><div class="nav" data-page="settings"><span class="ico">⚙</span><span>数据与备份</span></div><div class="sidefoot">LOCAL WORKSPACE · V0.5.1<br>仅本机保存</div></aside>
<main class="main"><header class="top"><div class="heading"><h1 id="pageTitle">视觉资产库</h1><p id="pageSub">把成功经验沉淀为可复用的视觉资产</p></div><div class="search"><span>⌕</span><input id="search" placeholder="搜索案例、材质、款式、提示词标签…"></div><div class="actions"><button class="btn" id="importBtn">导入</button><button class="btn" id="exportBtn">备份</button><button class="btn" id="updateBtn">检查更新</button><button class="btn primary" id="addBtn">＋ 新增资产</button></div></header>
<section class="stats"><div class="stat"><label>成功案例</label><strong id="caseCount">0</strong><small>完整提示词资产</small></div><div class="stat"><label>可复用模块</label><strong id="moduleCount">0</strong><small>跨品类调用</small></div><div class="stat"><label>已验证案例</label><strong id="verifiedCount">0</strong><small>经过实际生成验证</small></div><div class="stat"><label>关联图片</label><strong id="imageCount">0</strong><small>参考图与效果图</small></div></section><div id="content"></div></main></div>
<div class="overlay" id="detailOverlay"><aside class="detail"><div class="dhead"><h2>资产详情</h2><button class="close" id="closeDetail">×</button></div><div id="detailContent"></div></aside></div>
<div class="modal" id="editModal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">新增资产</h2><button class="close" id="closeModal">×</button></div><div id="modalForm"></div></div></div><div class="toast" id="toast"></div><input type="file" id="imagePicker" accept="image/*" hidden><input type="file" id="jsonPicker" accept=".json" hidden>
<script>
const CATS=["上装","下装","鞋履","配饰","整套搭配","其他"],TYPES=["款式与结构","面料材质","颜色与质感","场景与环境","光影","镜头与动作","人物与身体锁定","换装约束","失败修复","其他"],MODELS=["通用","RunningHub","WAN 3.0","MiniMax H3","其他"],ST=["已验证成功","待验证","失败案例"];let db={cases:[],modules:[]},page="gallery",filter="全部",chosen=null,kind="case",editId=null,editKind="case",imagePath="",activeDetailTab="prompt";const $=x=>document.getElementById(x);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}function image(x){return x.image?`<img src="/media/${encodeURIComponent(x.image.split(/[\\/]/).pop())}" onerror="this.outerHTML='<div class=placeholder>◇</div>'">`:`<div class="placeholder">◇</div>`}
async function load(){try{db=await(await fetch("/api/data")).json()}catch(e){toast("读取本地数据失败")}}async function save(){await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(db)})}function stats(){$("caseCount").textContent=db.cases.length;$("moduleCount").textContent=db.modules.length;$("verifiedCount").textContent=db.cases.filter(x=>x.status==="已验证成功").length;$("imageCount").textContent=[...db.cases,...db.modules].filter(x=>x.image).length}
function setTitle(t,s){$("pageTitle").textContent=t;$("pageSub").textContent=s}function render(){stats();document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));if(page==="gallery"||page==="all")gallery();else if(page==="modules")modules();else if(page==="vault")vault();else if(page==="smartsearch")smartSearchPage();else if(page==="compose")compose();else settings()}

function smartSearchPage(){
 setTitle("智能案例检索","输入服装款号或描述，检索匹配度达到 80% 的历史成功案例");
 $("content").innerHTML=`<div class="vault" style="max-width:920px"><h2>用新款服装，寻找过去验证成功的经验</h2><p>支持款号精确匹配，以及品类、版型、面料、颜色、结构细节和生成约束的组合检索。</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin:16px 0"><input id="smartQuery" placeholder="例如：LL-WZWY10278，或黑色立领无袖马甲、柔软哑光面料、双拉头拉链" style="flex:1;min-width:260px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)"><button class="btn primary" id="smartSearchBtn">检索成功案例</button></div><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:10px 0"><input id="includeConflicts" type="checkbox">同时显示属性冲突案例（仅供人工复核）</label><div style="font-size:12px;color:var(--muted)">默认只检索「已验证成功」案例；低于 80% 的结果不显示。当前为可解释的本地属性匹配，不是 AI 置信度。</div><div id="smartSearchStatus" style="margin-top:14px;color:var(--muted)">等待输入款号或服装描述。</div><div id="smartSearchResults" style="margin-top:12px"></div></div>`;
 $("smartSearchBtn").onclick=runSmartCaseSearch;$("smartQuery").onkeydown=e=>{if(e.key==="Enter")runSmartCaseSearch()};
}
function renderMatchConflicts(m){
 const conflicts=m.conflicts||[];
 if(!conflicts.length)return "";
 return '<p style="font-size:12px;color:#b45309;margin:8px 0">属性冲突，人工复核：'+esc(conflicts.map(c=>c.reason).join("；"))+'</p>';
}

function renderMatchAttributeDetails(m){
 const details=m.attribute_details||[];
 if(!details.length)return "";
 return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">'+details.map(d=>'<span title="已匹配：'+esc((d.matched_terms||[]).join("、"))+'；缺失：'+esc((d.missing_terms||[]).join("、"))+'" style="font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted)">'+esc(d.label)+' '+Math.round((d.coverage||0)*100)+'%</span>').join("")+'</div>';
}

async function runSmartCaseSearch(){
 const query=$("smartQuery").value.trim(),status=$("smartSearchStatus"),box=$("smartSearchResults");
 if(!query){status.textContent="请先输入服装款号或描述";box.innerHTML="";return}
 status.textContent="正在检索本地历史成功案例…";box.innerHTML="";
 try{
  const includeConflicts=$("includeConflicts")?.checked?"1":"0";
  const data=await scanApi("/api/cases/search?q="+encodeURIComponent(query)+"&threshold=0.8&include_conflicts="+includeConflicts);
  if(!data.matches.length){status.textContent="没有找到匹配度达到 80% 的已验证成功案例。可补充面料、颜色或结构细节后再检索。";return}
  status.textContent="找到 "+data.matches.length+" 个匹配度达到 80% 的历史成功案例"+(data.include_conflicts?"（包含冲突案例，请人工复核）":"");
  box.innerHTML=data.matches.map(m=>`<div class="vault" style="margin-top:10px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><div style="width:112px;height:132px;flex:0 0 112px;overflow:hidden;border-radius:8px;background:var(--panel)">\${m.case.image?image(m.case):'<div class="placeholder">◇</div>'}</div><div style="flex:1;min-width:220px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><b>\${esc(m.case.name||"未命名案例")}</b><strong style="color:var(--accent);white-space:nowrap">\${m.match_percent}%</strong></div><p style="font-size:12px;color:var(--muted);margin:8px 0">\${esc([m.case.category,m.case.subcategory,m.case.material,m.case.color].filter(Boolean).join(" · "))}</p><p style="font-size:12px;color:var(--muted);margin:8px 0">匹配依据：\${esc((m.reasons||[]).join("、"))}</p>\${renderMatchAttributeDetails(m)}\${renderMatchConflicts(m)}<button class="btn" data-caseid="\${esc(m.case.id)}">查看完整成功提示词</button></div></div>`).join("");
  box.querySelectorAll("button[data-caseid]").forEach(btn=>btn.addEventListener("click",()=>openDetail(btn.dataset.caseid,"case")));
 }catch(e){status.textContent="检索失败："+e.message}
}

function gallery(){setTitle("视觉资产库","把成功经验沉淀为可复用的视觉资产");let q=$("search").value.toLowerCase(),arr=db.cases.filter(x=>(filter==="全部"||x.category===filter)&&(!q||[x.name,x.category,x.subcategory,x.material,x.color,x.model,x.body,(x.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));$("content").innerHTML=`<div class="section"><div><h2>成功案例</h2><p>${arr.length} 条资产 · 图片优先的浏览方式</p></div><button class="btn" onclick="openEditor('case')">＋ 新增案例</button></div><div class="filters">${["全部",...CATS].map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter='${c}';render()">${c}</button>`).join("")}<select class="filter" id="statusF" onchange="render()"><option value="">全部状态</option>${ST.map(s=>`<option>${s}</option>`).join("")}</select><select class="filter" id="modelF" onchange="render()"><option value="">全部模型</option>${MODELS.map(s=>`<option>${s}</option>`).join("")}</select></div><div class="gallery" id="grid"></div>`;let st=$("statusF"),mf=$("modelF");st.value=window.sf||"";mf.value=window.mf||"";arr=arr.filter(x=>(!window.sf||x.status===window.sf)&&(!window.mf||x.model===window.mf));$("grid").innerHTML=arr.length?arr.map(x=>`<article class="card" onclick="openDetail('${x.id}','case')"><div class="photo">${image(x)}<span class="state ${x.status==='待验证'?'pending':x.status==='失败案例'?'failed':''}">${esc(x.status||"待验证")}</span></div><div class="cardbody"><div class="cardtitle">${esc(x.name)}</div><div class="tags">${[x.category,x.subcategory,x.material,...(x.tags||[]).slice(0,2)].filter(Boolean).slice(0,5).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="cardfoot"><span>${esc(x.model||"通用")}</span><span>${(x.updated_at||x.created_at||"").slice(0,10)}</span></div></div></article>`).join(""):`<div class="empty"><b>这里还没有视觉资产</b>添加一条实际生成成功的案例，逐步建立你的提示词资产库。</div>`}

function findComposeConflicts(base,mods){
 const issues=[],specific=x=>String(x||"").trim().toLowerCase(),generic=new Set(["","通用","全部","不限","all","any"]);
 for(const m of mods){const bm=specific(base.model),mm=specific(m.model);if(!generic.has(bm)&&!generic.has(mm)&&bm!==mm)issues.push("模型不兼容："+m.name+"（案例："+base.model+"；模块："+m.model+"）")}
 const rules=[{label:"拉链状态",yes:["拉链完全打开","拉链全开","拉链保持敞开","前襟完全打开"],no:["拉链完全闭合","拉链完全拉上","拉链闭合","前襟完全闭合"]},{label:"帽子结构",yes:["连帽","有帽"],no:["无帽","不带帽"]},{label:"袖型",yes:["无袖"],no:["长袖","短袖"]}];
 const textOf=x=>String(x.name||"")+" "+String(x.body||"");
 const checkPair=(a,b,label)=>{const ta=textOf(a),tb=textOf(b);for(const rule of rules){const ay=rule.yes.some(t=>ta.includes(t)),an=rule.no.some(t=>ta.includes(t)),by=rule.yes.some(t=>tb.includes(t)),bn=rule.no.some(t=>tb.includes(t));if((ay&&bn)||(an&&by))issues.push(rule.label+"互斥："+label)}};
 for(const m of mods)checkPair(base,m,"基础案例 / "+m.name);
 for(let i=0;i<mods.length;i++)for(let j=i+1;j<mods.length;j++){const a=mods[i],b=mods[j];if(String(a.module_type||"")!==String(b.module_type||""))continue;checkPair(a,b,a.name+" / "+b.name)}
 return [...new Set(issues)]
}

  try{
    const r = await fetch("/api/update/check",{cache:"no-store"});
    const d = await r.json();
    updateInfo = d;
    const apply = document.getElementById("applyUpdateBtn");
    if(!d.ok){
      if(status) status.textContent = "暂时无法检查更新：" + (d.error||"网络连接失败") + "。请检查 GitHub 网络连接。";
      if(apply) apply.style.display="none";
      if(showToast) toast("检查更新失败");
      return;
    }
    if(d.update_available){
      if(status) status.textContent = `发现新版本 V${d.latest_version}（当前 V${d.current_version}）。${d.notes||""} 更新不会覆盖你的提示词数据和图片。`;
      if(apply) apply.style.display="inline-block";
      if(showToast) toast("发现新版本 V"+d.latest_version);
    }else{
      if(status) status.textContent = `当前已是最新版本 V${d.current_version}。`;
      if(apply) apply.style.display="none";
      if(showToast) toast("当前已是最新版本");
    }
  }catch(e){
    if(status) status.textContent = "检查更新失败：" + e.message;
    if(showToast) toast("检查更新失败");
  }
}
async function applyUpdate(){
  if(!updateInfo || !updateInfo.update_available) return toast("请先检查更新");
  if(!confirm(`确定更新到 V${updateInfo.latest_version} 吗？工作台将自动关闭、替换程序并重新启动。你的提示词数据和图片会保留。`)) return;
  const status = document.getElementById("updateStatus");
  if(status) status.textContent = "正在下载更新文件，请不要关闭此窗口…";
  try{
    const r = await fetch("/api/update/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||"更新启动失败");
    if(status) status.textContent = d.message || "更新已开始，工作台即将重启。";
    alert(d.message || "更新已开始，工作台即将重启。");
  }catch(e){
    if(status) status.textContent = "更新失败：" + e.message;
    alert("更新失败：" + e.message);
  }
}

async function scanApi(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||"请求失败");return d}
async function refreshAutoScanState(){try{const d=await scanApi("/api/scan/auto");const b=$("autoScanToggle");if(b)b.textContent=d.enabled?"自动监控：已开启（点击关闭）":"自动监控：已关闭（点击开启）";const s=$("autoScanStatus");if(s)s.textContent=d.enabled?"工作台运行期间每 60 秒扫描一次已添加文件夹。":"自动监控已关闭；可随时手动扫描。"}catch(e){const b=$("autoScanToggle");if(b)b.textContent="自动监控状态不可用"}}
async function toggleAutoScan(){try{const d=await scanApi("/api/scan/auto");const r=await scanApi("/api/scan/auto",{enabled:!d.enabled});await refreshAutoScanState();toast(r.enabled?"已开启文件夹自动监控":"已关闭文件夹自动监控")}catch(e){toast("设置自动监控失败："+e.message)}}
async function addScanSource(){const folder=$("scanFolder").value.trim();if(!folder){$("scanStatus").textContent="请先填写文件夹路径";return}try{await scanApi("/api/scan/source",{folder,recursive:true});$("scanStatus").textContent="文件夹已添加："+folder;$("scanFolder").value="";await loadScanQueue()}catch(e){$("scanStatus").textContent="添加失败："+e.message}}
async function runAllScans(){const status=$("scanStatus");status.textContent="正在扫描，请稍候…";try{const d=await scanApi("/api/scan/sources");if(!d.sources.length){status.textContent="请先添加一个历史素材文件夹";return}let total={added:0,changed:0,unchanged:0};for(const s of d.sources){const r=await scanApi("/api/scan/run",{source_id:s.id});for(const k of Object.keys(total))total[k]+=r.summary[k]||0}status.textContent="扫描完成：新增 "+total.added+"，变化 "+total.changed+"，未变化 "+total.unchanged;await loadScanQueue()}catch(e){status.textContent="扫描失败："+e.message}}
async function loadScanQueue(){try{const d=await scanApi("/api/scan/pending");const box=$("scanQueue");box.innerHTML="";if(!d.items.length){box.innerHTML='<p style="color:var(--muted)">暂无待审核文件</p>';return}d.items.slice(0,80).forEach(x=>{const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)";const info=document.createElement("div");info.style.minWidth="0";const name=document.createElement("b");name.textContent=x.name;const meta=document.createElement("div");meta.style.cssText="font-size:12px;color:var(--muted);overflow-wrap:anywhere";meta.textContent=x.relative_path+" · "+x.media_type;info.append(name,meta);const actions=document.createElement("div");actions.style.cssText="display:flex;gap:5px;flex-shrink:0";for(const [label,status] of [["保留","approved"],["忽略","ignored"]]){const btn=document.createElement("button");btn.className="btn";btn.textContent=label;btn.addEventListener("click",()=>reviewScanFile(x.path,status));actions.appendChild(btn)}row.append(info,actions);box.appendChild(row)})}catch(e){$("scanQueue").textContent="读取失败："+e.message}}
async function loadScanMatches(){const box=$("scanQueue");try{const d=await scanApi("/api/scan/matches");if(!d.matches.length){$("scanStatus").textContent="暂未发现可靠的文件名关联候选";return}const grouped=new Map();for(const m of d.matches){if(!grouped.has(m.prompt_path))grouped.set(m.prompt_path,[]);if(m.asset_type==="image")grouped.get(m.prompt_path).push(m)}const panel=document.createElement("div");panel.style.cssText="margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px";const title=document.createElement("b");title.textContent="按提示词组合多张图片（每组最多 8 张）";panel.appendChild(title);const note=document.createElement("p");note.style.cssText="font-size:12px;color:var(--muted)";note.textContent="请勾选属于同一套穿搭/同一成功案例的图片，例如整体图、正反面、领口、面料细节。文件名关联仅是建议，必须人工确认。";panel.appendChild(note);let groupNo=0;for(const [promptPath,items] of grouped){if(!items.length)continue;groupNo++;const group=document.createElement("div");group.style.cssText="padding:10px 0;border-top:1px solid var(--line)";const head=document.createElement("div");head.style.cssText="font-size:12px;overflow-wrap:anywhere;margin-bottom:7px";head.textContent="提示词："+promptPath;group.appendChild(head);items.slice(0,20).forEach((m,i)=>{const label=document.createElement("label");label.style.cssText="display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12px;overflow-wrap:anywhere";const cb=document.createElement("input");cb.type="checkbox";cb.className="bundleAsset";cb.value=m.asset_path;cb.dataset.prompt=promptPath;cb.checked=i===0;const txt=document.createElement("span");txt.textContent=m.asset_path+" · 文件名关联 "+Math.round(m.score*100)+"%";label.append(cb,txt);group.appendChild(label)});const btn=document.createElement("button");btn.className="btn primary";btn.style.marginTop="7px";btn.textContent="分析这组图片并提取案例";btn.onclick=()=>{const selected=[...group.querySelectorAll(".bundleAsset:checked")].map(x=>x.value);if(!selected.length){alert("请至少勾选一张图片");return}if(selected.length>8){alert("每组最多选择 8 张图片");return}runAiAnalysis({prompt_path:promptPath,asset_paths:selected})};group.appendChild(btn);panel.appendChild(group)}box.prepend(panel);$("scanStatus").textContent="已按提示词整理图片候选组，请勾选同一套穿搭的多角度素材"}catch(e){$("scanStatus").textContent="匹配分析失败："+e.message}}
async function runAiAnalysis(match){const key=$("aiKey").value.trim();if(!key){$("scanStatus").textContent="请先填写 API Key";return}const paths=match.asset_paths||[match.asset_path];if(!confirm("将原始提示词和选中的 "+paths.length+" 张图片发送到你填写的 AI 服务进行分析。密钥不会保存在工作台。继续吗？"))return;$("scanStatus").textContent="正在综合分析多张图片…";try{const d=await scanApi("/api/ai/analyze",{prompt_path:match.prompt_path,asset_paths:paths,api_key:key,endpoint:$("aiEndpoint").value.trim(),model:$("aiModel").value.trim()});$("scanStatus").textContent="AI 分析完成，已保存到人工确认队列；原始提示词不会被改写。";await loadAiReviews()}catch(e){$("scanStatus").textContent="AI 分析失败："+e.message}}
async function loadAiReviews(){try{const d=await scanApi("/api/ai/reviews");const box=$("scanQueue");box.innerHTML="";if(!d.reviews.length){box.textContent="暂无待确认的 AI 分析结果";return}d.reviews.forEach(x=>{const card=document.createElement("div");card.style.cssText="padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px";const title=document.createElement("b");title.textContent=x.result.title||"未命名案例";const summary=document.createElement("p");summary.style.cssText="font-size:13px;white-space:pre-wrap";summary.textContent=(x.result.prompt_summary||"无摘要")+"\\n分类："+(x.result.category||"其他")+" · 置信度："+Math.round((Number(x.result.confidence)||0)*100)+"%";const source=document.createElement("div");source.style.cssText="font-size:11px;color:var(--muted);overflow-wrap:anywhere";source.textContent=x.prompt_path+" ↔ "+((x.result.asset_paths||[x.asset_path]).length)+" 张关联图片";const risks=document.createElement("p");risks.style.cssText="font-size:12px;color:var(--muted)";risks.textContent="风险提示："+(Array.isArray(x.result.risk_notes)?x.result.risk_notes.join("；"):"无");const actions=document.createElement("div");actions.style.cssText="display:flex;gap:8px";const yes=document.createElement("button");yes.className="btn primary";yes.textContent="确认并入库";yes.onclick=()=>approveAiReview(x.id);const no=document.createElement("button");no.className="btn";no.textContent="拒绝";no.onclick=()=>rejectAiReview(x.id);actions.append(yes,no);card.append(title,summary,source,risks,actions);box.append(card)})}catch(e){$("scanQueue").textContent="读取 AI 审核结果失败："+e.message}}
async function approveAiReview(id){try{const d=await scanApi("/api/ai/approve",{analysis_id:id});db=d.data;render();$("scanStatus").textContent="已确认入库，案例已加入成功案例库";await loadAiReviews()}catch(e){$("scanStatus").textContent="入库失败："+e.message}}
async function rejectAiReview(id){try{await scanApi("/api/ai/reject",{analysis_id:id});await loadAiReviews()}catch(e){$("scanStatus").textContent="拒绝操作失败："+e.message}}
async function reviewScanFile(path,status){try{await scanApi("/api/scan/review",{path,status});await loadScanQueue()}catch(e){alert("审核操作失败："+e.message)}}
