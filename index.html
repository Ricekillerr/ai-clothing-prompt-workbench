<script>
const CATS=["上装","下装","鞋履","配饰","整套搭配","其他"],TYPES=["款式与结构","面料材质","颜色与质感","场景与环境","光影","镜头与动作","人物与身体锁定","换装约束","失败修复","其他"],MODELS=["通用","RunningHub","WAN 3.0","MiniMax H3","Seedance 2.5","其他"],ST=["已验证成功","待验证","失败案例"];let db={cases:[],modules:[]},page="gallery",filter="全部",chosen=null,kind="case",editId=null,editKind="case",imagePath="",activeDetailTab="prompt";const selectedCaseIds=new Set();const selectedModuleIds=new Set();let deletedAssetsCache=null,trashLoading=false;let saveQueue=Promise.resolve();const $=x=>document.getElementById(x);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalizeTags(value){const values=Array.isArray(value)?value:typeof value==="string"?value.split(/[,，]/):[];return values.map(item=>String(item??"").trim()).filter(Boolean).slice(0,50)}
function normalizeAssetRows(rows){return rows.filter(item=>item&&typeof item==="object"&&!Array.isArray(item)).map(item=>({...item,tags:normalizeTags(item.tags),image:typeof item.image==="string"?item.image:"",created_at:typeof item.created_at==="string"?item.created_at:"",updated_at:typeof item.updated_at==="string"?item.updated_at:""}))}
function normalizeAssetData(data){if(!data||!Array.isArray(data.cases)||!Array.isArray(data.modules))throw new Error("本地资产数据结构不正确");return {cases:normalizeAssetRows(data.cases),modules:normalizeAssetRows(data.modules)}}
function pruneSelectionToVisible(selection,visibleItems){const visibleIds=new Set(visibleItems.map(item=>item.id));for(const id of [...selection])if(!visibleIds.has(id))selection.delete(id)}function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}function image(x){return x.image?`<img src="/media/${encodeURIComponent(x.image.split(/[\\/]/).pop())}" onerror="this.outerHTML='<div class=placeholder>◇</div>'">`:`<div class="placeholder">◇</div>`}
async function load(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch("/api/data",{signal:controller.signal,cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(!data||!Array.isArray(data.cases)||!Array.isArray(data.modules))throw new Error("本地资产数据结构不正确");db=normalizeAssetData(data);return true}catch(e){toast(e.name==="AbortError"?"读取本地数据超时，请检查工作台服务":"读取本地数据失败："+e.message);return false}finally{clearTimeout(timer)}}
function save(){
 const payload=JSON.stringify(db);
 const task=saveQueue.catch(()=>{}).then(async()=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{
   const response=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:payload,signal:controller.signal});
   let result={};try{result=await response.json()}catch(_){}
   if(!response.ok||result.ok===false)throw new Error(result.error||"数据保存失败");
   return true;
  }catch(error){
   if(error.name==="AbortError"){const uncertain=new Error("保存响应超时，服务器可能已经完成写入");uncertain.uncertain=true;throw uncertain}
   throw error;
  }finally{clearTimeout(timer)}
 });

 return task;
}
function saveFailureMessage(action,outcome,error){
 if(outcome==="server")return action+"响应超时，已重新读取服务器当前数据，请核对";
 if(outcome==="unknown")return action+"响应超时，无法确认保存结果，请刷新工作台核对";
 return action+"失败，原数据已恢复："+error.message;
}
async function reconcileSaveFailure(error,rollback){
 if(error?.uncertain){
  await saveQueue.catch(()=>{});
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
   const response=await fetch("/api/data",{cache:"no-store",signal:controller.signal});
   if(!response.ok)throw new Error("HTTP "+response.status);
   db=normalizeAssetData(await response.json());
   return "server";
  }catch(_){rollback();return "unknown"}
  finally{clearTimeout(timer)}
 }
 rollback();
 return "rollback";
}function stats(){$("caseCount").textContent=db.cases.length;$("moduleCount").textContent=db.modules.length;$("verifiedCount").textContent=db.cases.filter(x=>x.status==="已验证成功").length;$("imageCount").textContent=[...db.cases,...db.modules].filter(x=>x.image).length}
function setTitle(t,s){$("pageTitle").textContent=t;$("pageSub").textContent=s}function render(){stats();document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.page===page));$("addBtn").style.display=page==="trash"?"none":"";if(page==="gallery"||page==="all")gallery();else if(page==="modules")modules();else if(page==="vault")vault();else if(page==="smartsearch")smartSearchPage();else if(page==="compose")compose();else if(page==="trash")trashPage();else settings()}

function smartSearchPage(){

 $("smartSearchBtn").onclick=runSmartCaseSearch;$("smartQuery").onkeydown=e=>{if(e.key==="Enter")runSmartCaseSearch()};$("visualSearchPick").onclick=()=>$("visualSearchFile").click();$("visualSearchFile").onchange=e=>{const file=e.target.files?.[0];if(file)runVisualCaseSearch(file);e.target.value=""};

async function imagePerceptualHash(blob){
 const url=URL.createObjectURL(blob);
 try{
  const img=new Image();img.src=url;
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error("图片读取失败"))});
  const canvas=document.createElement("canvas");canvas.width=32;canvas.height=32;
  const ctx=canvas.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,32,32);
  const pixels=ctx.getImageData(0,0,32,32).data,gray=new Float64Array(1024);
  for(let i=0;i<1024;i++)gray[i]=(pixels[i*4]*0.299+pixels[i*4+1]*0.587+pixels[i*4+2]*0.114);
  const coeff=[];
  for(let v=0;v<8;v++)for(let u=0;u<8;u++){
   let sum=0;
   for(let y=0;y<32;y++)for(let x=0;x<32;x++)
    sum+=gray[y*32+x]*Math.cos(((2*x+1)*u*Math.PI)/64)*Math.cos(((2*y+1)*v*Math.PI)/64);
   coeff.push(sum);
  }
  const median=[...coeff].sort((a,b)=>a-b)[32];
  return coeff.map(value=>value>=median?"1":"0").join("");
 }finally{URL.revokeObjectURL(url)}
}
function imageHashDistance(a,b){let distance=0;for(let i=0;i<Math.min(a.length,b.length);i++)if(a[i]!==b[i])distance++;return distance}
async function runVisualCaseSearch(file){
 const status=$("visualSearchStatus"),box=$("visualSearchResults");box.innerHTML="";
 if(!file.type.startsWith("image/")){status.textContent="请选择有效图片文件";return}
 if(file.size>20*1024*1024){status.textContent="查询图片超过 20MB，请先压缩后再检索";return}
 status.textContent="正在读取查询图片…";
 try{
  const queryHash=await imagePerceptualHash(file),sources=[];
  for(const item of db.cases.filter(x=>x.status==="已验证成功")){
   const names=[...new Set([...(Array.isArray(item.images)?item.images:[]),item.image].filter(Boolean))];
   for(let index=0;index<names.length;index++)sources.push({item,name:String(names[index]).split(/[\\/]/).pop(),index});
  }
  if(!sources.length){status.textContent="成功案例库中暂无关联图片";return}
  const candidates=sources.slice(0,500),matches=[];
  for(let i=0;i<candidates.length;i++){
   const source=candidates[i];
   status.textContent="正在比较历史图片 "+(i+1)+" / "+candidates.length+"…";
   try{
    const response=await fetch("/media/"+encodeURIComponent(source.name),{cache:"force-cache"});
    if(!response.ok)continue;
    const hash=await imagePerceptualHash(await response.blob()),distance=imageHashDistance(queryHash,hash);
    matches.push({item:source.item,name:source.name,index:source.index,score:1-distance/64,distance});
   }catch(_){}
  }
  matches.sort((a,b)=>a.distance-b.distance||String(a.item.name).localeCompare(String(b.item.name)));
  const top=matches.slice(0,12).filter(x=>x.distance<=28);
  if(!top.length){status.textContent="没有找到足够接近的历史图片。不同角度、裁切和背景会显著影响这种像素结构相似度。";return}
  status.textContent="完成：比较 "+matches.length+" 张历史图片，显示最接近的 "+top.length+" 张。结果仅为视觉近似初筛。";
  box.innerHTML=top.map(m=>`<div class="vault" style="display:flex;gap:12px;align-items:center;margin:8px 0"><div style="width:84px;height:100px;flex:0 0 84px;overflow:hidden;border-radius:8px">${image({...m.item,image:m.name})}</div><div style="flex:1;min-width:0"><b>${esc(m.item.name||"未命名案例")}</b><p style="font-size:12px;color:var(--muted);margin:6px 0">${esc(m.item.sku||m.item.category||"历史成功案例")} · ${esc(m.name)}</p><p style="font-size:12px;color:var(--muted);margin:4px 0">图像近似分：${Math.round(m.score*100)} / 100 · 汉明距离：${m.distance}</p><button class="btn" data-visual-case="${esc(m.item.id)}">打开完整案例</button></div></div>`).join("");
  box.querySelectorAll("[data-visual-case]").forEach(button=>button.onclick=()=>openDetail(button.dataset.visualCase,"case"));
 }catch(error){status.textContent="图片检索失败："+error.message}
}

async function recordGenerationOutcome(caseId,outcome){
 const notes=$("generationOutcomeNotes")?.value||"";
 const label=outcome==="success"?"生成成功":"生成失败";
 if(!confirm("确认将此案例标记为「"+label+"」？系统会保留本次修改前的历史版本。"))return;
 const before=db.cases.find(item=>item.id===caseId);
 const previousAt=before?.last_generation_at||"";
 try{
  await scanApi("/api/cases/outcome",{case_id:caseId,outcome,notes});
 }catch(writeError){
  // A timed-out response does not prove the server rolled back the write.
  try{
   const check=await fetch("/api/data",{cache:"no-store"});
   if(!check.ok)throw new Error("服务器数据暂不可读取");
   const latest=normalizeAssetData(await check.json());
   const saved=latest.cases.find(item=>item.id===caseId);
   if(!saved||saved.last_generation_outcome!==outcome
      ||saved.last_generation_note!==(notes.trim().slice(0,1000))
      ||saved.last_generation_at===previousAt)throw new Error("尚未核实到本次生成结果");
   db=latest;render();openDetail(caseId,"case");
   toast("请求响应异常，但已核实生成结果保存成功");
   return;
  }catch(_){
   toast("生成结果尚未确认；请重新打开案例核对，勿立即重复提交");
   return;
  }
 }
 // The write is confirmed. A subsequent refresh failure must not be reported as a failed write.
 try{
  const response=await fetch("/api/data",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  db=normalizeAssetData(await response.json());render();openDetail(caseId,"case");
  toast("已记录生成结果："+label);
 }catch(refreshError){
  toast("生成结果已保存，但列表刷新失败；重新打开工作台即可读取最新状态");
 }
}

function findComposeConflicts(base,mods){
 const issues=[],specific=x=>String(x||"").trim().toLowerCase(),generic=new Set(["","通用","全部","不限","整套搭配","其他","all","any","runninghub","平台","platform"]);
 const scopeOf=x=>specific(x.category_scope||"通用");
 for(const m of mods){
  const bm=specific(base.model),mm=specific(m.model);
  if(!generic.has(bm)&&!generic.has(mm)&&bm!==mm)issues.push("模型不兼容："+m.name+"（案例："+base.model+"；模块："+m.model+"）");
  const baseCategory=specific(base.category),moduleScope=scopeOf(m);
  if(!generic.has(baseCategory)&&!generic.has(moduleScope)&&baseCategory!==moduleScope)
   issues.push("适用品类不匹配："+m.name+"（基础案例："+base.category+"；模块适用："+m.category_scope+"）");
 }
 const rules=[{label:"拉链状态",yes:["拉链完全打开","拉链全开","拉链保持敞开","前襟完全打开"],no:["拉链完全闭合","拉链完全拉上","拉链闭合","前襟完全闭合"]},{label:"帽子结构",yes:["连帽","有帽"],no:["无帽","不带帽"]},{label:"袖型",yes:["无袖"],no:["长袖","短袖"]}];
 const textOf=x=>String(x.name||"")+" "+String(x.body||"");
 const checkPair=(a,b,label)=>{const ta=textOf(a),tb=textOf(b);for(const rule of rules){const ay=rule.yes.some(t=>ta.includes(t)),an=rule.no.some(t=>ta.includes(t)),by=rule.yes.some(t=>tb.includes(t)),bn=rule.no.some(t=>tb.includes(t));if((ay&&bn)||(an&&by))issues.push(rule.label+"互斥："+label)}};
 for(const m of mods)checkPair(base,m,"基础案例 / "+m.name);
 for(let i=0;i<mods.length;i++)for(let j=i+1;j<mods.length;j++){const a=mods[i],b=mods[j],sa=scopeOf(a),sb=scopeOf(b);if(!generic.has(sa)&&!generic.has(sb)&&sa!==sb)continue;checkPair(a,b,a.name+" / "+b.name)}
 return [...new Set(issues)]
}

function mergeImportedAssets(data,current){
 if(!data||!Array.isArray(data.cases)||!Array.isArray(data.modules))throw new Error("JSON 格式不正确");
 const ids=new Set([...current.cases,...current.modules].map(item=>String(item?.id??"").trim()).filter(Boolean));
 const merged={cases:[...current.cases],modules:[...current.modules]};
 let added=0,skipped=0;
 for(const [source,target] of [[data.cases,merged.cases],[data.modules,merged.modules]]){
  for(const item of source){
   if(!item||typeof item!=="object"||Array.isArray(item)||(typeof item.id!=="string"&&typeof item.id!=="number")||String(item.id).trim()===""){skipped++;continue}
   const id=String(item.id).trim();
   if(ids.has(id)){skipped++;continue}
   ids.add(id);target.push({...item,id,tags:normalizeTags(item.tags),image:typeof item.image==="string"?item.image:""});added++;
  }
 }
 return {data:merged,added,skipped};
}

let updateInfo = null, autoUpdateInProgress = false;
let autoUpdateAuthorized=false, autoUpdateIdleTimer=null, autoUpdateCountdownTimer=null;
let autoUpdateLastActivity=Date.now(), autoUpdateSkippedVersion=null;
const AUTO_UPDATE_IDLE_MS=15*60*1000, AUTO_UPDATE_COUNTDOWN_SECONDS=60;
function clearAutoUpdateTimers(){
 if(autoUpdateIdleTimer!==null){clearTimeout(autoUpdateIdleTimer);autoUpdateIdleTimer=null}
 if(autoUpdateCountdownTimer!==null){clearTimeout(autoUpdateCountdownTimer);autoUpdateCountdownTimer=null}
 const cancel=$("cancelAutoUpdateBtn");if(cancel)cancel.style.display="none";
 const notice=$("autoUpdateNotice");if(notice)notice.style.display="none";
}
function scheduleAuthorizedAutoUpdate(){
 if(!autoUpdateAuthorized||!updateInfo?.update_available
    ||autoUpdateSkippedVersion===updateInfo.latest_version||autoUpdateInProgress)return;
 if(autoUpdateIdleTimer!==null)clearTimeout(autoUpdateIdleTimer);
 const remaining=Math.max(1000,AUTO_UPDATE_IDLE_MS-(Date.now()-autoUpdateLastActivity));
 autoUpdateIdleTimer=setTimeout(()=>{
  autoUpdateIdleTimer=null;
  if(document.visibilityState!=="visible"||!document.hasFocus()){
   autoUpdateIdleTimer=setTimeout(scheduleAuthorizedAutoUpdate,60000);return;
  }
  startAuthorizedAutoUpdateCountdown();
 },remaining);
}
function startAuthorizedAutoUpdateCountdown(){
 let seconds=AUTO_UPDATE_COUNTDOWN_SECONDS;
 toast("已连续空闲 15 分钟；60 秒后自动更新，任意操作可延期");
 const tick=()=>{
  if(!autoUpdateAuthorized||!updateInfo?.update_available||autoUpdateInProgress){clearAutoUpdateTimers();return}
  if(Date.now()-autoUpdateLastActivity<AUTO_UPDATE_IDLE_MS
     ||document.visibilityState!=="visible"||!document.hasFocus()){
   clearAutoUpdateTimers();scheduleAuthorizedAutoUpdate();return;
  }
  const status=$("updateStatus"),cancel=$("cancelAutoUpdateBtn");
  const notice=$("autoUpdateNotice"),noticeText=$("autoUpdateNoticeText");
  const message="已授权自动更新：连续空闲 15 分钟，"+seconds+" 秒后开始下载、校验和安装；任意操作可延期。更新前会创建完整备份。";
  if(status)status.textContent=message;
  if(cancel)cancel.style.display="inline-block";
  if(notice)notice.style.display="flex";
  if(noticeText)noticeText.textContent=message;
  if(seconds<=0){clearAutoUpdateTimers();applyUpdate(true);return}
  seconds--;autoUpdateCountdownTimer=setTimeout(tick,1000);
 };
 tick();
}
function markAutoUpdateActivity(){
 autoUpdateLastActivity=Date.now();
 if(autoUpdateCountdownTimer!==null){clearAutoUpdateTimers();scheduleAuthorizedAutoUpdate()}
 else if(autoUpdateAuthorized&&updateInfo?.update_available)scheduleAuthorizedAutoUpdate();
}
document.addEventListener("pointerdown",markAutoUpdateActivity,true);
document.addEventListener("keydown",markAutoUpdateActivity,true);
document.addEventListener("touchstart",markAutoUpdateActivity,true);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")markAutoUpdateActivity()});
async function cancelScheduledAutoUpdate(){
 autoUpdateSkippedVersion=updateInfo?.latest_version||null;
 clearAutoUpdateTimers();
 try{await scanApi("/api/update/auto/skip",{version:autoUpdateSkippedVersion||""})}catch(error){}
 const status=$("updateStatus");
 if(status)status.textContent="已取消 V"+(autoUpdateSkippedVersion||"当前")+" 的自动安装；仍可随时手动一键更新。只有出现更新版本时才会再次自动安排。";
 toast("已取消此版本的自动安装");
}
async function refreshAutoUpdateState(){
 try{
  const state=await scanApi("/api/update/auto");
  autoUpdateAuthorized=state.enabled===true;
  autoUpdateSkippedVersion=state.skipped_version||null;
  const button=$("autoUpdateToggle"),status=$("autoUpdateStatus");
  if(button)button.textContent=state.enabled?"自动更新：已授权（点击关闭）":"自动更新：未授权（点击开启）";
  if(status)status.textContent=state.enabled?"已授权自动下载、校验和安装；检测到新版本后等待连续空闲 15 分钟，再倒计时 60 秒。任意操作会延期，安装前自动创建完整备份。":"当前仅自动检查更新，不会自动安装；开启后无需每次手动下载或确认。";
  if(autoUpdateAuthorized&&updateInfo?.update_available)scheduleAuthorizedAutoUpdate();
 }catch(error){if($("autoUpdateToggle"))$("autoUpdateToggle").textContent="自动更新状态不可用"}
}
async function toggleAutoUpdate(){
 try{
  const current=await scanApi("/api/update/auto");
  const result=await scanApi("/api/update/auto",{enabled:!current.enabled});
  await refreshAutoUpdateState();
  if(!result.enabled)clearAutoUpdateTimers();
  else if(updateInfo?.update_available)scheduleAuthorizedAutoUpdate();
  toast(result.enabled?"已授权自动更新（仅在空闲时安装）":"已关闭自动更新授权");
 }catch(error){toast("设置自动更新失败："+error.message)}
}
async function checkUpdate(showToast=true){
  const status = document.getElementById("updateStatus");
  if(status) status.textContent = "正在连接 GitHub 检查版本…";
  try{
    const r = await fetch("/api/update/check",{cache:"no-store"});
    const d = await r.json();
    updateInfo = d;
    const apply = document.getElementById("applyUpdateBtn");
    if(!d.ok){
      if(status) status.textContent = "暂时无法检查更新：" + (d.error||"网络连接失败") + "。请检查 GitHub 网络连接。";
      if(apply) apply.style.display="none";
      if(showToast) toast("检查更新失败");
      return;
    }
    if(d.update_available){
      if(status) status.textContent = `发现新版本 V${d.latest_version}（当前 V${d.current_version}）。${d.notes||""} 更新不会覆盖你的提示词数据和图片。`;
      if(apply) apply.style.display="inline-block";
      const autoResponse=await fetch("/api/update/auto",{cache:"no-store"});
      const autoState=await autoResponse.json();
      autoUpdateAuthorized=autoState.enabled===true;
      autoUpdateSkippedVersion=autoState.skipped_version||null;
      if(autoUpdateSkippedVersion&&autoUpdateSkippedVersion!==d.latest_version){
        await scanApi("/api/update/auto/skip",{version:""});
        autoUpdateSkippedVersion=null;
      }
      if(autoUpdateAuthorized&&!autoUpdateInProgress&&autoUpdateSkippedVersion!==d.latest_version){
        if(status)status.textContent="已授权自动更新：检测到 V"+d.latest_version+"，将在连续空闲 15 分钟并倒计时 60 秒后安装；任意操作可延期。";
        scheduleAuthorizedAutoUpdate();
      }else{
        clearAutoUpdateTimers();
        if(status&&autoUpdateSkippedVersion===d.latest_version)status.textContent="已取消 V"+d.latest_version+" 的自动安装；仍可手动更新。出现更新版本后会重新安排。";
      }
      if(showToast) toast("发现新版本 V"+d.latest_version);
    }else{
      if(status) status.textContent = `当前已是最新版本 V${d.current_version}。`;
      if(apply) apply.style.display="none";
      clearAutoUpdateTimers();
      if(showToast) toast("当前已是最新版本");
    }
  }catch(e){
    if(status) status.textContent = "检查更新失败：" + e.message;
    if(showToast) toast("检查更新失败");
  }
}
async function applyUpdate(automatic=false){
  if(!updateInfo || !updateInfo.update_available) return toast("请先检查更新");
  if(automatic&&autoUpdateInProgress)return;
  if(!automatic&&!confirm(`确定更新到 V${updateInfo.latest_version} 吗？工作台将自动关闭、替换程序并重新启动。你的提示词数据和图片会保留。`)) return;
  if(automatic)autoUpdateInProgress=true;
  const status = document.getElementById("updateStatus");
  if(status) status.textContent = "正在创建完整备份、下载并校验更新文件…";
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10*60*1000);
  let responseReceived=false,updateRequestSent=false;
  try{
    await save();
    updateRequestSent=true;
    const r = await fetch("/api/update/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",signal:controller.signal});
    responseReceived=true;
    const d = await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||"更新启动失败");
    if(status) status.textContent = d.message || "更新已开始，工作台即将重启。";
    if(!automatic)alert(d.message || "更新已开始，工作台即将重启。");
  }catch(e){
    if(!updateRequestSent&&automatic)autoUpdateInProgress=false;
    if(responseReceived&&automatic)autoUpdateInProgress=false;
    const message=!updateRequestSent
      ? "更新已取消：待保存数据未能确认写入，因此没有启动更新。"+e.message
      : responseReceived
        ? "更新未能启动："+e.message
        : "更新请求已发出，但连接中断，无法确认安装是否启动。请等待 1–2 分钟；若工作台未自动重启，再手动检查版本。请勿连续重复启动更新。";
    if(status)status.textContent=message;
    if(!automatic)alert(message);
  }finally{clearTimeout(timer)}
}

 finally{clearTimeout(timer)}
}

async function loadAiReviews(){try{const d=await scanApi("/api/ai/reviews");const box=$("scanQueue");box.innerHTML="";if(!d.reviews.length){box.textContent="暂无待确认的 AI 分析结果";return}d.reviews.forEach(x=>{const card=document.createElement("div");card.style.cssText="padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:10px";const title=document.createElement("b");title.textContent=x.result.title||"未命名案例";const summary=document.createElement("p");summary.style.cssText="font-size:13px;white-space:pre-wrap";summary.textContent=(x.result.prompt_summary||"无摘要")+"\\n分类："+(x.result.category||"其他")+" · 置信度："+Math.round((Number(x.result.confidence)||0)*100)+"%";const source=document.createElement("div");source.style.cssText="font-size:11px;color:var(--muted);overflow-wrap:anywhere";source.textContent=x.prompt_path+" ↔ "+((x.result.asset_paths||[x.asset_path]).length)+" 张关联图片";const roles=document.createElement("p");roles.style.cssText="font-size:12px;color:var(--muted)";roles.textContent="图片分类："+(Array.isArray(x.result.asset_roles)&&x.result.asset_roles.length?x.result.asset_roles.map(r=>(r.asset_index||"?")+" · "+(r.role_label||"待确认")+" · "+({primary:"主参考",secondary:"次参考",supporting:"辅助参考"}[r.priority]||"辅助参考")).join("；"):"尚无可靠分类，入库后可人工核对");const outfit=document.createElement("p");outfit.style.cssText="font-size:12px;color:var(--muted)";outfit.textContent="穿搭拆解："+(Array.isArray(x.result.outfit_items)&&x.result.outfit_items.length?x.result.outfit_items.map(p=>(p.item_index||"?")+" · "+(p.category||"其他")+" "+(p.name||p.subcategory||"未命名")).join("；"):"未识别到可靠单品拆解");const risks=document.createElement("p");risks.style.cssText="font-size:12px;color:var(--muted)";risks.textContent="风险提示："+(Array.isArray(x.result.risk_notes)?x.result.risk_notes.join("；"):"无");const actions=document.createElement("div");actions.style.cssText="display:flex;gap:8px";const yes=document.createElement("button");yes.className="btn primary";yes.textContent="确认并入库";yes.onclick=()=>approveAiReview(x.id);const no=document.createElement("button");no.className="btn";no.textContent="拒绝";no.onclick=()=>rejectAiReview(x.id);actions.append(yes,no);card.append(title,summary,source,roles,outfit,risks,actions);box.append(card)})}catch(e){$("scanQueue").textContent="读取 AI 审核结果失败："+e.message}}
async function approveAiReview(id){try{const d=await scanApi("/api/ai/approve",{analysis_id:id});db=normalizeAssetData(d.data);render();$("scanStatus").textContent="已确认入库，案例已加入成功案例库";await loadAiReviews()}catch(e){$("scanStatus").textContent="入库失败："+e.message}}
async function rejectAiReview(id){try{await scanApi("/api/ai/reject",{analysis_id:id});await loadAiReviews()}catch(e){$("scanStatus").textContent="拒绝操作失败："+e.message}}
async function reviewScanFile(path,status){try{await scanApi("/api/scan/review",{path,status});await loadScanQueue()}catch(e){alert("审核操作失败："+e.message)}}

document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{if(n.dataset.cat){filter=n.dataset.cat;page="gallery"}else if(n.dataset.page){page=n.dataset.page;filter="全部";if(page==="trash")deletedAssetsCache=null}render()});$("search").oninput=render;$("addBtn").onclick=()=>openEditor(page==="modules"?"module":"case");$("importBtn").onclick=()=>$("jsonPicker").click();$("exportBtn").onclick=exportJSON;$("updateBtn").onclick=()=>{page="settings";render();checkUpdate(true)};$("jsonPicker").onchange=e=>{const file=e.target.files?.[0];e.target.value="";if(file)importJSON(file)};$("imagePicker").onchange=e=>e.target.files[0]&&uploadImage(e.target.files[0]);$("closeDetail").onclick=closeDetail;$("closeModal").onclick=closeEditor;$("detailOverlay").onclick=e=>{if(e.target===$("detailOverlay"))closeDetail()};$("editModal").onclick=e=>{if(e.target===$("editModal"))closeEditor()};

let heartbeatTimer=null;
async function sendWorkbenchHeartbeat(){
 try{await fetch("/api/client/heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}",cache:"no-store",keepalive:true})}catch(e){}
}
function startWorkbenchHeartbeat(){
 sendWorkbenchHeartbeat();
 if(heartbeatTimer===null) heartbeatTimer=setInterval(sendWorkbenchHeartbeat,5000);
}
window.addEventListener("pagehide",()=>{if(heartbeatTimer!==null){clearInterval(heartbeatTimer);heartbeatTimer=null;}try{navigator.sendBeacon("/api/client/close",new Blob(["{}"],{type:"application/json"}));}catch(e){}});
