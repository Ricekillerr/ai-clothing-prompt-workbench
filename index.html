<script>
const CATS=["上装","下装","鞋履","配饰","整套搭配","其他"],TYPES=["款式与结构","面料材质","颜色与质感","场景与环境","光影","镜头与动作","人物与身体锁定","换装约束","失败修复","其他"],MODELS=["通用","RunningHub","WAN 3.0","MiniMax H3","Seedance 2.5","其他"],ST=["已验证成功","待验证","失败案例"];let db={cases:[],modules:[]},page="gallery",filter="全部",chosen=null,kind="case",editId=null,editKind="case",imagePath="",activeDetailTab="prompt";const selectedCaseIds=new Set();const selectedModuleIds=new Set();let deletedAssetsCache=null,trashLoading=false;let saveQueue=Promise.resolve();const $=x=>document.getElementById(x);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normalizeTags(value){const values=Array.isArray(value)?value:typeof value==="string"?value.split(/[,，]/):[];return values.map(item=>String(item??"").trim()).filter(Boolean).slice(0,50)}
function normalizeAssetRows(rows){return rows.filter(item=>item&&typeof item==="object"&&!Array.isArray(item)).map(item=>({...item,tags:normalizeTags(item.tags),image:typeof item.image==="string"?item.image:"",created_at:typeof item.created_at==="string"?item.created_at:"",updated_at:typeof item.updated_at==="string"?item.updated_at:""}))}
function normalizeAssetData(data){if(!data||!Array.isArray(data.cases)||!Array.isArray(data.modules))throw new Error("本地资产数据结构不正确");return {cases:normalizeAssetRows(data.cases),modules:normalizeAssetRows(data.modules)}}
function pruneSelectionToVisible(selection,visibleItems){const visibleIds=new Set(visibleItems.map(item=>item.id));for(const id of [...selection])if(!visibleIds.has(id))selection.delete(id)}function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}function image(x){return x.image?`<img loading="lazy" decoding="async" src="/media/${encodeURIComponent(x.image.split(/[\\/]/).pop())}" onerror="this.outerHTML='<div class=placeholder>◇</div>'">`:`<div class="placeholder">◇</div>`}
async function load(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch("/api/data",{signal:controller.signal,cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(!data||!Array.isArray(data.cases)||!Array.isArray(data.modules))throw new Error("本地资产数据结构不正确");db=normalizeAssetData(data);return true}catch(e){toast(e.name==="AbortError"?"读取本地数据超时，请检查工作台服务":"读取本地数据失败："+e.message);return false}finally{clearTimeout(timer)}}
function save(){
 const payload=JSON.stringify(db);
 const task=saveQueue.catch(()=>{}).then(async()=>{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{
   const response=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:payload,signal:controller.signal});
   let result={};try{result=await response.json()}catch(_){}
   if(!response.ok||result.ok===false)throw new Error(result.error||"数据保存失败");
   return true;
  }catch(error){
   if(error.name==="AbortError"){const uncertain=new Error("保存响应超时，服务器可能已经完成写入");uncertain.uncertain=true;throw uncertain}
   throw error;
  }finally{clearTimeout(timer)}
 });
 saveQueue=task;
 return task;
}
function saveFailureMessage(action,outcome,error){
 if(outcome==="server")return action+"响应超时，已重新读取服务器当前数据，请核对";
 if(outcome==="unknown")return action+"响应超时，无法确认保存结果，请刷新工作台核对";
 return action+"失败，原数据已恢复："+error.message;
}
async function reconcileSaveFailure(error,rollback){
 if(error?.uncertain){
  await saveQueue.catch(()=>{});
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
  try{
   const response=await fetch("/api/data",{cache:"no-store",signal:controller.signal});
   if(!response.ok)throw new Error("HTTP "+response.status);
   db=normalizeAssetData(await response.json());
   return "server";
  }catch(_){rollback();return "unknown"}
  finally{clearTimeout(timer)}
 }
 rollback();
 return "rollback";
}function stats(){$("caseCount").textContent=db.cases.length;$("moduleCount").textContent=db.modules.length;$("verifiedCount").textContent=db.cases.filter(x=>x.status==="已验证成功").length;$("imageCount").textContent=[...db.cases,...db.modules].filter(x=>x.image).length}

function smartSearchPage(){

 $("smartSearchBtn").onclick=runSmartCaseSearch;$("smartQuery").onkeydown=e=>{if(e.key==="Enter")runSmartCaseSearch()};$("visualSearchPick").onclick=()=>$("visualSearchFile").click();$("visualSearchFile").onchange=e=>{const file=e.target.files?.[0];if(file)runVisualCaseSearch(file);e.target.value=""};
}
const VISUAL_HASH_BITS=63;
const VISUAL_HASH_MAX_DISTANCE=12;
let visualSearchRequestId=0;
const IMAGE_HASH_DCT_BASIS=Array.from({length:8},(_,frequency)=>Array.from({length:32},(_,position)=>Math.cos(((2*position+1)*frequency*Math.PI)/64)));
async function imagePerceptualHash(blob){
 const url=URL.createObjectURL(blob);
 try{
  const img=new Image();
  const loaded=new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error("图片解码失败"))});

async function recordGenerationOutcome(caseId,outcome){
 const notes=$("generationOutcomeNotes")?.value||"";
 const label=outcome==="success"?"生成成功":"生成失败";
 if(!confirm("确认将此案例标记为「"+label+"」？系统会保留本次修改前的历史版本。"))return;
 const before=db.cases.find(item=>item.id===caseId);
 const previousAt=before?.last_generation_at||"";
 try{
  await scanApi("/api/cases/outcome",{case_id:caseId,outcome,notes});
 }catch(writeError){
  // A timed-out response does not prove the server rolled back the write.
  try{
   const check=await fetch("/api/data",{cache:"no-store"});
   if(!check.ok)throw new Error("服务器数据暂不可读取");
   const latest=normalizeAssetData(await check.json());
   const saved=latest.cases.find(item=>item.id===caseId);
   if(!saved||saved.last_generation_outcome!==outcome
      ||saved.last_generation_note!==(notes.trim().slice(0,1000))
      ||saved.last_generation_at===previousAt)throw new Error("尚未核实到本次生成结果");
   db=latest;render();openDetail(caseId,"case");
   toast("请求响应异常，但已核实生成结果保存成功");
   return;
  }catch(_){
   toast("生成结果尚未确认；请重新打开案例核对，勿立即重复提交");
   return;
  }
 }
 // The write is confirmed. A subsequent refresh failure must not be reported as a failed write.
 try{
  const response=await fetch("/api/data",{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  db=normalizeAssetData(await response.json());render();openDetail(caseId,"case");
  toast("已记录生成结果："+label);
 }catch(refreshError){
  toast("生成结果已保存，但列表刷新失败；重新打开工作台即可读取最新状态");
 }
}

y:flex;gap:8px;margin-top:10px"><button class="btn" id="copyCompositionBtn" type="button">复制结果</button><button class="btn" id="saveCompositionBtn" type="button">另存为待验证案例</button></div></div></div>';

function renderComposeModuleList(){

 if(!search)return;

 if(q!==composeModuleQuerySnapshot){composeModulePage=1;composeModuleQuerySnapshot=q}
 const modules=Array.isArray(db.modules)?db.modules:[];

 for(const id of composeSelectedModuleIds)if(!validIds.has(id))composeSelectedModuleIds.delete(id);
 const filtered=modules.filter(x=>!q||[x.name,x.module_type,x.category_scope,x.material,x.body].join(" ").toLowerCase().includes(q));
 const totalPages=Math.max(1,Math.ceil(filtered.length/COMPOSE_MODULE_PAGE_SIZE));
 composeModulePage=Math.min(Math.max(1,composeModulePage),totalPages);

 const list=$("composeModuleList");
 list.innerHTML=pageItems.length?pageItems.map(x=>'<label class="check"><input type="checkbox" class="composeModule" value="'+esc(x.id)+'" '+(composeSelectedModuleIds.has(x.id)?"checked":"")+' aria-label="选择模块：'+esc(x.name)+'">'+esc(x.name)+' <small style="color:#8290a3">'+esc(x.module_type||"")+'</small></label>').join(""):'<p style="font-size:10px;color:#8994a4">没有匹配的模块。</p>';
 list.querySelectorAll(".composeModule").forEach(input=>input.addEventListener("change",()=>{
  if(input.checked)composeSelectedModuleIds.add(input.value);else composeSelectedModuleIds.delete(input.value);
  const status=$("composeModuleSelectionStatus");
  if(status)status.textContent="已选 "+composeSelectedModuleIds.size+" 个模块";
 }));
 const pager=$("composeModulePagination"),prev=$("composeModulePrev"),next=$("composeModuleNext"),label=$("composeModulePageLabel");
 if(pager)pager.style.display=totalPages>1?"flex":"none";
 if(label)label.textContent="第 "+composeModulePage+" / "+totalPages+" 页 · "+filtered.length+" 个匹配";
 if(prev){prev.disabled=composeModulePage<=1;prev.onclick=()=>{if(composeModulePage>1){composeModulePage--;renderComposeModuleList()}}}
 if(next){next.disabled=composeModulePage>=totalPages;next.onclick=()=>{if(composeModulePage<totalPages){composeModulePage++;renderComposeModuleList()}}}
 const status=$("composeModuleSelectionStatus");
 if(status)status.textContent="已选 "+composeSelectedModuleIds.size+" 个模块";
}

let trashPageNum=1,trashQuerySnapshot=null;
const TRASH_PAGE_SIZE=50;
async function trashPage(){
 setTitle("回收站","已删除的案例和提示词模块仍保留在本地，可随时恢复");
 $("content").innerHTML='<div class="vault"><h3>已删除资产</h3><p id="trashContent">正在读取本地删除记录…</p></div>';
 if(deletedAssetsCache===null){
  if(trashLoading)return;
  trashLoading=true;
  try{
   const response=await fetch("/api/assets/deleted",{cache:"no-store"});
   if(!response.ok)throw new Error("HTTP "+response.status);
   const payload=await response.json();
   deletedAssetsCache=Array.isArray(payload.items)?payload.items:[];
  }catch(error){
   if(page==="trash")$("trashContent").textContent="回收站读取失败："+error.message;
   return;
  }finally{trashLoading=false}
 }
 if(page!=="trash")return;
 const query=$("search").value.trim().toLowerCase();
 if(query!==trashQuerySnapshot){trashPageNum=1;trashQuerySnapshot=query}
 const items=deletedAssetsCache.filter(item=>!query||[item.name,item.sku,item.category,item.summary].join(" ").toLowerCase().includes(query));
 if(!items.length){
  $("content").innerHTML='<div class="empty"><b>回收站为空</b>删除的案例和模块会保留在这里，方便恢复。</div>';
  return;
 }
 const totalPages=Math.max(1,Math.ceil(items.length/TRASH_PAGE_SIZE));
 trashPageNum=Math.min(Math.max(1,trashPageNum),totalPages);
 const pageItems=items.slice((trashPageNum-1)*TRASH_PAGE_SIZE,trashPageNum*TRASH_PAGE_SIZE);
 $("content").innerHTML='<div class="section"><div><h2>最近删除</h2><p>最多显示最近 500 条；共 '+items.length+' 条 · 第 '+trashPageNum+' / '+totalPages+' 页 · 每页 '+TRASH_PAGE_SIZE+' 条；恢复后会回到原来的资产库。</p></div><span class="tag">'+items.length+' 条</span></div><div class="vaultgrid">'+pageItems.map(item=>'<div class="vault"><div class="hero" style="height:150px">'+image({image:item.image})+'</div><div class="kind">'+esc(item.kind==="module"?"提示词模块":"案例资产")+' · '+esc(item.category||"未分类")+'</div><h3>'+esc(item.name)+'</h3><p>'+esc(item.sku||"无款号")+' · 删除于 '+esc(item.deleted_at||"")+'</p><p>'+esc(item.summary||"没有摘要")+'</p><button class="btn primary" data-trash-restore="'+esc(item.asset_id)+'" data-revision-id="'+esc(item.revision_id)+'">恢复资产</button></div>').join("")+'</div><div id="trashPagination" style="display:none;justify-content:center;align-items:center;gap:10px;margin:18px 0"><button class="btn" id="trashPrev" type="button">上一页</button><span id="trashPageLabel" aria-live="polite" style="font-size:12px;color:var(--muted)"></span><button class="btn" id="trashNext" type="button">下一页</button></div>';
 document.querySelectorAll("[data-trash-restore]").forEach(button=>{
  button.onclick=()=>restoreDeletedAsset(button.dataset.trashRestore,button.dataset.revisionId,button);
 });
 const pager=$("trashPagination"),prev=$("trashPrev"),next=$("trashNext"),label=$("trashPageLabel");
 if(pager)pager.style.display=totalPages>1?"flex":"none";
 if(label)label.textContent="第 "+trashPageNum+" / "+totalPages+" 页";
 if(prev){prev.disabled=trashPageNum<=1;prev.addEventListener("click",()=>{if(trashPageNum>1){trashPageNum--;return trashPage()}})}
 if(next){next.disabled=trashPageNum>=totalPages;next.addEventListener("click",()=>{if(trashPageNum<totalPages){trashPageNum++;return trashPage()}})}
}

async function restoreDeletedAsset(assetId,revisionId,button){
 if(!confirm("恢复这条资产？它会重新出现在原来的视觉资产库或提示词模块中。"))return;
 button.disabled=true;button.textContent="恢复中…";
 try{
  const response=await fetch("/api/assets/revisions/restore",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({asset_id:assetId,revision_id:revisionId,expected_absent:true})});
  const payload=await response.json();
  if(!response.ok||!payload.ok)throw new Error(payload.error||"恢复失败");
  db=normalizeAssetData(payload.data);deletedAssetsCache=null;stats();toast("资产已恢复");
  await trashPage();

function composePreflight(base,selected){

 const models=new Set([base.model,...selected.map(x=>x.model)].filter(x=>x&&x!=="通用"));
 if(models.size>1)errors.push("基础案例与模块的指定模型不一致："+[...models].join("、")+"；请先人工统一适用模型");
 const allTags=[base, ...selected].flatMap(x=>Array.isArray(x.tags)?x.tags:[]).map(x=>String(x).toLowerCase());
 if(allTags.includes("黑白")&&allTags.includes("彩色"))errors.push("检测到明确的互斥标签：黑白 / 彩色");
 const scopes=new Set(selected.map(x=>x.category_scope).filter(x=>x&&x!=="通用"&&x!=="全部"));
 if(scopes.size&&base.category&&![...scopes].includes(base.category)&&![...scopes].includes("整套搭配"))errors.push("模块适用品类与基础案例不一致："+[...scopes].join("、")+" / "+base.category);
 const bodies=[base.body,...selected.map(x=>x.body)].join("\n").toLowerCase();
 const forbidden=["禁止改变裤装","不要修改鞋履","保持配饰不变"].filter(rule=>bodies.includes(rule));
 if(forbidden.length&&selected.length)warnings.push("基础提示词含约束："+forbidden.join("、")+"；请确认追加模块没有要求修改这些部位。");
 if(selected.some(x=>x.module_type==="人物与身体锁定"))warnings.push("人物锁定模块可能覆盖基础案例的人物描述，请人工检查先后关系。");

 return {errors,warnings};
}

async function restoreFullBackup(file){if(!confirm("确定使用这份完整 ZIP 备份恢复工作台吗？当前数据会先自动创建安全备份；恢复会替换当前数据库、案例、模块和参考图片。"))return;const status=$("restoreStatus");status.textContent="正在等待未完成的保存并上传备份，请保持本页面开启…";const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10*60*1000);try{await saveQueue;const response=await fetch("/api/backup/restore",{method:"POST",headers:{"Content-Type":"application/zip","X-Backup-Filename":encodeURIComponent(file.name)},body:file,signal:controller.signal});const payload=await response.json();if(!response.ok||!payload.ok)throw new Error(payload.error||("HTTP "+response.status));const restored=await load();render();status.textContent=restored?"恢复完成。恢复前安全备份："+(payload.safety_backup||"已创建"):"服务器已确认恢复，但页面重新读取失败。请刷新工作台后再继续操作。恢复前安全备份："+(payload.safety_backup||"已创建")}catch(e){status.textContent=e.name==="AbortError"?"恢复请求超过 10 分钟，结果尚未确认。请刷新页面核对，勿立即重复恢复。":"恢复失败："+e.message}finally{clearTimeout(timer)}}
function importJSON(file){const reader=new FileReader();reader.onload=async()=>{try{const data=JSON.parse(reader.result),previous=db,seen=new Set([...db.cases,...db.modules].map(x=>x.id));let added=0;["cases","modules"].forEach(k=>{(data[k]||[]).forEach(x=>{if(!x.id||seen.has(x.id))return;seen.add(x.id);db[k].push(x);added++})});if(!added)return toast("没有可导入的新记录");await save();render();toast(`导入完成：${added} 条`)}catch(e){db=previous;render();toast("导入失败，已恢复原数据："+e.message)}};reader.readAsText(file)}
async function checkUpdate(manual){const box=$("updateStatus");try{const data=await (await fetch("/api/update/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({manual:Boolean(manual)}),cache:"no-store"})).json();if(data.error)throw new Error(data.error);if(box)box.textContent=data.message||`当前 V${data.current_version||"0.6.5"}；最新 V${data.latest_version||"未知"}`;const apply=$("applyUpdateBtn");if(apply)apply.style.display=data.available&&data.download_url?"":"none";window.updateCandidate=data;if(manual)toast(data.available?"发现新版本，可手动更新":"当前已是最新版本")}catch(e){if(box)box.textContent="检查更新失败："+e.message;if(manual)toast("检查更新失败："+e.message)}}
async function refreshAutoUpdateState(){const button=$("autoUpdateToggle"),status=$("autoUpdateStatus"),cancel=$("cancelAutoUpdateBtn"),notice=$("autoUpdateNotice"),noticeText=$("autoUpdateNoticeText");if(!button)return;try{const data=await (await fetch("/api/update/auto",{cache:"no-store"})).json();button.textContent="空闲自动更新："+(data.enabled?"已授权":"未授权");button.setAttribute("aria-pressed",String(Boolean(data.enabled)));const countdown=Number(data.countdown_seconds||0),remaining=data.seconds_until_install==null?null:Math.max(0,Math.round(Number(data.seconds_until_install)));if(status)status.textContent=data.pending_install?(countdown>0?"将在 "+countdown+" 秒后自动安装；任何点击、输入、滚动或窗口失焦都会取消本次倒计时。":"已满足空闲条件，即将自动安装。"):remaining!==null?(data.deferred_reason?"自动安装已延期："+data.deferred_reason+"；剩余约 "+remaining+" 秒。":"持续空闲且窗口可见、聚焦后自动安装；剩余约 "+remaining+" 秒。"):(data.enabled?"已授权：发现新版本后，连续空闲 15 分钟、页面可见且聚焦，再倒计时 60 秒自动安装。":"未授权：只提示新版本，不会自动下载或安装。")+(data.last_error?" 上次错误："+data.last_error:"");if(cancel)cancel.style.display=data.pending_install?"":"none";if(notice)notice.style.display=data.pending_install&&countdown>0?"flex":"none";if(noticeText&&countdown>0)noticeText.textContent="将在 "+countdown+" 秒后自动安装 V"+(data.latest_version||"新版本")+"；操作页面可延期。";if(data.pending_install)setTimeout(refreshAutoUpdateState,1000)}catch(e){if(status)status.textContent="自动更新状态读取失败："+e.message}}
async function toggleAutoUpdate(){try{const data=await scanApi("/api/update/auto",{toggle:true});toast(data.enabled?"已授权空闲自动更新":"已撤销自动更新授权");refreshAutoUpdateState()}catch(e){toast(e.message)}}
async function cancelScheduledAutoUpdate(){try{const data=await scanApi("/api/update/cancel",{});toast(data.message||"已取消本次自动安装");refreshAutoUpdateState()}catch(e){toast(e.message)}}
async function applyUpdate(){const data=window.updateCandidate;if(!data?.download_url)return toast("没有可安装的更新");if(!confirm("将先创建完整本地备份，再更新程序并重启。数据库和参考图片不会被替换。继续？"))return;try{await saveQueue}catch(e){toast("更新尚未发送：上一条保存失败，请先核对数据");return}const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10*60*1000);let requestSent=false;try{const response=await fetch("/api/update/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),signal:controller.signal});requestSent=true;const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"更新失败");toast("更新已安装，工作台即将重启");setTimeout(()=>location.reload(),6000)}catch(e){if(!requestSent&&e.name==="AbortError")toast("更新请求超过 10 分钟，结果尚未确认。请刷新并核对版本，勿重复点击更新");else toast("更新失败："+e.message)}finally{clearTimeout(timer)}}

function bindEvents(){
 document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>{if(n.dataset.cat){filter=n.dataset.cat;page="gallery"}else{page=n.dataset.page;if(page!=="trash")filter="全部"}render()});
 $("search").oninput=()=>{if(!["trash","smartsearch","settings"].includes(page))render();else if(page==="trash")trashPage()};$("addBtn").onclick=()=>openEditor("case");$("importBtn").onclick=()=>$("jsonPicker").click();$("exportBtn").onclick=exportJSON;$("updateBtn").onclick=()=>checkUpdate(true);$("closeDetail").onclick=closeDetail;$("closeModal").onclick=closeEditor;$("detailOverlay").onclick=e=>{if(e.target===$("detailOverlay"))closeDetail()};$("editModal").onclick=e=>{if(e.target===$("editModal"))closeEditor()};$("imagePicker").onchange=async e=>{const file=e.target.files[0];if(!file)return;const fd=new FormData();fd.append("image",file);const response=await fetch("/api/upload",{method:"POST",body:fd}),data=await response.json();if(data.path){imagePath=data.path;$("f_image").value=file.name}};$("jsonPicker").onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=""};
}

async function init(){
 bindEvents();
 const loaded=await load();
 render();
 if(!loaded)setTimeout(init,5000);
}
init();
</script></body></html>
