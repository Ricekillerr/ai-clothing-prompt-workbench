name: Prompt Atelier review gate

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  review-context:
    name: Classify changed paths and private data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      security_required: ${{ steps.review.outputs.security_required }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run read-only path review
        id: review
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          else
            BASE="$BEFORE_SHA"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD^"
          fi
          python tools/review_gate.py --base "$BASE" --head HEAD

  security-regression:
    name: Conditional trust-boundary security regression
    needs: review-context
    if: needs.review-context.outputs.security_required == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security-focused regressions
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          python -m unittest -v \
            tests.test_review_gate \
            tests.test_source_syntax \
            tests.test_ai_analyzer \
            tests.test_analyzer \
            tests.test_storage \
            tests.test_upgrade_bridge \
            tests.test_console_output \
            tests.test_duplicate_instance \
            tests.test_windows_runtime \
            tests.test_frontend_syntax \
            tests.test_navigation_accessibility

# This workflow never calls an AI model and never comments, labels, pushes,
# merges, approves, or releases. Maintainers remain the only merge gate.
