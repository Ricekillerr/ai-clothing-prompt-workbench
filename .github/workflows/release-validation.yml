name: Release validation

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Validate release source version and update channel
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path("ai_prompt_workbench.py").read_text(encoding="utf-8")
          version = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)', source, re.M)
          branch = re.search(r'^GITHUB_BRANCH\s*=\s*["\']([^"\']+)', source, re.M)
          if not version or not branch:
              raise SystemExit("Cannot identify APP_VERSION or GITHUB_BRANCH")
          manifest = json.loads(Path("update_manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version.group(1):
              raise SystemExit("Manifest version does not match APP_VERSION")
          ref_name = os.environ.get("REF_NAME", "")
          if ref_name.startswith("release/") and branch.group(1) != ref_name:
              raise SystemExit(f"Updater targets {branch.group(1)!r}, but this release branch is {ref_name!r}")
          if ref_name == "release/v0.6.5-stabilization" and version.group(1) != "0.6.5":
              raise SystemExit("V0.6.5 stabilization branch still contains a non-V0.6.5 source")
          print(f"Source version {version.group(1)} targets update channel {branch.group(1)}")
          PY
      - name: Validate release manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path("update_manifest.json")
          if not manifest_path.exists():
              raise SystemExit("update_manifest.json is missing")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest.get("files")
          hashes = manifest.get("sha256")
          if not isinstance(files, list) or not files:
              raise SystemExit("manifest files must be a non-empty list")
          if not isinstance(hashes, dict):
              raise SystemExit("manifest sha256 must be an object")
          for name in files:
              path = Path(name)
              if path.is_absolute() or ".." in path.parts or not path.is_file():
                  raise SystemExit(f"unsafe or missing update file: {name}")
              expected = hashes.get(name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA-256 mismatch: {name}")
          print(f"Validated {len(files)} update files.")
          PY
      - name: Run hardening tests when present
        run: |
          if [ -f test_hardening.py ]; then
            python -m unittest test_hardening -v
          elif find tests -type f -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo "No tests discovered in this legacy branch; release remains blocked on candidate test suite and Windows acceptance."
          fi
