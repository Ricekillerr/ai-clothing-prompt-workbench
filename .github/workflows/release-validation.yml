name: Release validation

on:
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Report exact runtime SHA-256 values for manifest repair
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("ai_prompt_workbench.py", "index.html", "updater.py", "启动AI服装提示词工作台.bat"):
              print(f"RUNTIME_SHA256 {name} {hashlib.sha256(Path(name).read_bytes()).hexdigest()}")
          PY
      - name: Validate inline frontend JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.active = True
                      self.current = []
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      self.parts.append("".join(self.current))
                      self.active = False
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          scripts = [x for x in parser.parts if x.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/prompt-atelier-inline.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script block(s).")
          PY
          node --check /tmp/prompt-atelier-inline.js
      - name: Validate release manifest hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path = Path("update_manifest.json")
          if not manifest_path.exists():
              raise SystemExit("update_manifest.json is missing")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest.get("files")
          hashes = manifest.get("sha256")
          if not isinstance(files, list) or not files:
              raise SystemExit("manifest files must be a non-empty list")
          if not isinstance(hashes, dict):
              raise SystemExit("manifest sha256 must be an object")
          for name in files:
              path = Path(name)
              if path.is_absolute() or ".." in path.parts or not path.is_file():
                  raise SystemExit(f"unsafe or missing update file: {name}")
              expected = hashes.get(name)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"SHA-256 mismatch: {name}")
          print(f"Validated {len(files)} update files.")
          PY
      - name: Require and run repository regression suite
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit("No regression tests discovered under tests/")
          print(f"Discovered {count} regression tests.")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY
          if [ -f test_hardening.py ]; then
            python -m unittest -v test_hardening
          fi

  release_gate:
    name: Release source and channel gate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release source version and update channel
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path("ai_prompt_workbench.py").read_text(encoding="utf-8")
          version = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)', source, re.M)
          branch = re.search(r'^GITHUB_BRANCH\s*=\s*["\']([^"\']+)', source, re.M)
          if not version or not branch:
              raise SystemExit("Cannot identify APP_VERSION or GITHUB_BRANCH")
          manifest = json.loads(Path("update_manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version.group(1):
              raise SystemExit("Manifest version does not match APP_VERSION")
          ref_name = os.environ.get("REF_NAME", "")
          if ref_name.startswith("release/") and branch.group(1) != ref_name:
              raise SystemExit(f"Release candidate updater must target its staging channel {ref_name!r}, not {branch.group(1)!r}")
          if ref_name.startswith("release/"):
              expected_version = ref_name.split("/", 1)[1].split("-", 1)[0].lstrip("vV")
              if version.group(1) != expected_version:
                  raise SystemExit(f"Release branch expects version {expected_version}, but source is {version.group(1)}")
          print(f"Source version {version.group(1)} correctly targets its staging update channel {branch.group(1)}")
          PY

  powershell_sync_script:
    name: Validate Windows candidate sync script
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse PowerShell script without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/sync_v065_candidate.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            exit 1
          }
          Write-Host "PowerShell syntax valid."
